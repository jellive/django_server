version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: jell_server_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jell_db}
      MYSQL_USER: ${DB_USER:-jell_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jell_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    container_name: jell_server_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: jell_server_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
